name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify.py
  demo:
    runs-on: windows-2022
    strategy:
      matrix:
        target: [net48, net481]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project demo/InventoryDemo.csproj --framework ${{ matrix.target }} --configuration Release
